[workspace]
resolver = "3"
members = [
  "crates/parselens-core",
  "crates/parselens-cli",
  "crates/parselens-wasm",
  "crates/parselens-repr",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tablerst/ParseLens"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.1", features = ["derive"] }
json5 = "1.3.1"
jsonc-parser = { version = "0.32.4", features = ["serde", "serde_json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"
wasm-bindgen = "0.2.125"

[workspace]
resolver = "3"
members = [
  "crates/json5helper-core",
  "crates/json5helper-cli",
  "crates/json5helper-wasm",
  "crates/repr-json",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/tablerst/jsonhelper"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.1", features = ["derive"] }
json5 = "1.3.1"
jsonc-parser = { version = "0.32.4", features = ["serde", "serde_json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"
wasm-bindgen = "0.2.125"
